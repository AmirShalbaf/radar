# =====================================================================
# analysts.yml — پیکربندی منابع رادار
#
# قانون حاکم:
#   scores: true   ← این منبع حق دارد در امتیازدهی اثر بگذارد
#   scores: false  ← فقط زمینه. هرگز عدد از آن وارد موتور نمی‌شود
#   میدان scores مال موتور امتیازدهی ردشده است — بخش ۴.۲ STATE.md.
#   تا تصمیم نشست ۸ دست نخورد؛ آزمون قفلش می‌کند.
#
# قانون خاموشی: هر منبع با enabled: false باید disabled_reason داشته باشد.
#   دلیل در خروجی و INDEX می‌آید تا خاموشی بی‌صدا نباشد.
#
# فهرست رصد — نشست ۷ب، تصمیم کاربر ۳ و ۴ اکتبر ۲۰۲۶. هر منبع watch صریح دارد:
#   full          دیدن کامل با radar_video.py --new — فریم، کارت، snap، گزارش
#   crypto_title  دیدن کامل فقط وقتی عنوان یکی از watch_keywords را دارد
#   text          فقط متن با radar_intake.py
#   مقدار ناشناخته، میدان غایب، یا منبع خاموش در فهرست رصد خطای بلند است.
#   آزمون: tests/test_watch_list.py
#
# قانون هم‌خطی: دو منبع از یک مکتب = یک رأی، نه دو رأی.
#   جدول مکاتب پایین فایل آمده است.
# =====================================================================

meta:
  version: "1.7"
  framework: "Radar 7"
  updated: "2026-10-04"
  changelog: >
    ۱.۷ — نشست ۷ب: میدان watch برای همه منابع — دیدن کامل برای کریپتوسیتی،
    تکرارگر و کوون؛ سالووی فقط با عنوان کریپتویی و فهرست کلیدواژه؛ بقیه فقط متن.
    ۱.۶ — نشست ۴: شناسه و هندل واقعی چهار کانال؛ باب الیوت با خوراک
    Nonconsensus روشن شد؛ وانگ و کایکو خاموش با دلیل؛ الگوی پیوند اسکی.

sources:

  # -------------------------------------------------------------------
  # لنزهای تازه — سه شکاف ساختاری
  # -------------------------------------------------------------------

  joseph_wang:
    name_fa: "جوزف وانگ"
    name_en: "Joseph Wang"
    role: "لنز تحلیل‌گر"
    school: "لوله‌کشی پولی"
    kind: "rss"
    url: "https://fedguy.com/feed/"
    lang: ["en"]
    scores: true
    enabled: false   # ۱.۶ — نشست ۴
    watch: "text"
    disabled_reason: >
      خوراک از ۲۳ فوریه ۲۰۲۶ تازه نشده و فقط خلاصه با «[…]» می‌دهد — متن
      کامل نه. صفحه اصلی سایت از لپ‌تاپ ۴۰۳ داد. سنجش ۲۹ سپتامبر ۲۰۲۶.
    notes: >
      معامله‌گر سابق میز عملیات بازار باز فدرال‌رزرو نیویورک.
      ورودی ستون ۱ (نقدینگی) و بلوک نرخ و منحنی.
      ضعف: تقریباً هرگز درباره کوین مشخص حرف نمی‌زند.
    conflict: "مدیر صندوق Monetary Macro — منافع در جهت‌گیری ماکرو دارد"

  kaiko:
    name_fa: "کایکو"
    name_en: "Kaiko Research"
    role: "لنز تحلیل‌گر"
    school: "ریزساختار بازار"
    kind: "index"                        # ۱.۳ — کایکو خوراک ندارد، مدل ایمیلی است
    url: "https://research.kaiko.com/insights"
    # ۱.۶ — مسیر نشانی اسکی است؛ \w حرف و رقم فارسی را هم می‌گیرد
    link_pattern: 'href="(/insights/[A-Za-z0-9_-]+)"'
    lang: ["en"]
    scores: true
    enabled: false   # ۱.۶ — نشست ۴
    watch: "text"
    disabled_reason: >
      research.kaiko.com با ۳۰۱ به app.kaiko.com می‌رود و صفر پیوند دارد، با هر
      عامل کاربر. جایگزین kaiko.com/resources/categories/data-blog سنجیده شد:
      دو مقاله فقط صفحه معرفی‌اند — خلاصه و فهرست بخش‌ها — و متن اصلی PDF
      پشت فرم دانلود است. متن کامل خوانده نشد. سنجش ۲۹ سپتامبر ۲۰۲۶.
    notes: >
      عمق دفتر سفارش، ساختار مدت نوسان‌پذیری، تمرکز موقعیت آپشن.
      این تنها منبعی است که بلوک جریان را از فیوچرز فراتر می‌برد.
      مؤسسه است نه شخص — کارنامه فردی ندارد، ولی داده دارد.
    conflict: "فروشنده داده نهادی"

  bob_elliott:
    name_fa: "باب الیوت"
    name_en: "Bob Elliott"
    role: "لنز تحلیل‌گر"
    school: "ماکرو سیستماتیک"
    kind: "rss"
    url: "https://bobeunlimited.substack.com/feed"   # ۱.۶ — خبرنامه Nonconsensus
    lang: ["en"]
    scores: true
    enabled: true    # ۱.۶ — نشست ۴، تصمیم کاربر
    watch: "text"
    notes: >
      مدیر سابق بریج‌واتر. تنها صدای ساختاراً بدبین در مجموعه.
      خوراک رسمی: خبرنامه Nonconsensus روی سابستک، از ژوئن ۲۰۲۵.
      ضعف: بیشتر نوشته‌ها پیش‌نمایش کوتاه‌اند با «Continue reading» — متن
      کامل نیستند. گفتگوهای «Macro Talk» ویدیواند و متنی ندارند.
    conflict: "مدیر صندوق Unlimited Funds"

  # -------------------------------------------------------------------
  # لنز زمینه‌ای — امتیاز نمی‌دهد
  # -------------------------------------------------------------------

  ray_dalio:
    name_fa: "ری دالیو"
    name_en: "Ray Dalio"
    role: "لنز زمینه‌ای"
    school: "چرخه بدهی بلندمدت"
    kind: "youtube"
    handle: "@principlesbyraydalio"
    channel_id: "UCqvaXJ1K3HheTPNjH-KpwXQ"   # تأییدشده ۶ اوت   # اسکریپت خودش پیدا می‌کند و در خروجی چاپ می‌کند
    lang: ["en"]
    scores: false
    enabled: true
    watch: "text"
    notes: >
      افق دهه‌ای، نه هفته‌ای. فقط سقف واقع‌بینانه سناریوها در گام ۸.
      هم‌خانواده با باب الیوت (بریج‌واتر) ← حق رأی ندارد تا دوباره‌شماری نشود.
      قانون نرخ پایه: سابقه هشدارهای فروپاشی باید شمرده شود، نه فقط موارد موفق.
    conflict: "کتاب و برند شخصی می‌فروشد"

  # -------------------------------------------------------------------
  # کتابخانه روش — تکنیک می‌آموزد، نظر نمی‌دهد
  # -------------------------------------------------------------------

  tradecity_pro:
    name_fa: "آرشیا عزیزپور — تریدسیتی پرو"
    name_en: "Trade City Pro"
    role: "کتابخانه روش"
    school: "پرایس اکشن و ساختار"
    kind: "youtube"
    handle: "@Tradecitypro"
    channel_id: "UCSiXqiaB5JgSicZBGh1VXEw"   # تأییدشده: «Trade city pro»
    collinear_with: "cryptocity_pro"
    lang: ["fa"]
    scores: false
    enabled: true
    watch: "text"
    notes: >
      سری آموزش رایگان: پرایس اکشن، رسم حمایت و مقاومت، کندل‌شناسی، مدیریت ریسک.
      دروازه ورود هر تکنیک به رادار = قانون بازگشت فهرست ردشده‌ها:
      آزمون خارج از نمونه، پس از کارمزد و فاندینگ، روی حداقل سه دارایی.
      نکته هم‌راستا: ویدئوی «تعصب معامله‌گر» ≈ قانون سوگیری صفر رادار ۵.۳.
    conflict: "اپلیکیشن و دوره آموزشی دارد"

  no_bs_crypto:
    name_fa: "نو بی‌اس کریپتو"
    name_en: "No Bs Crypto"
    role: "کتابخانه روش"
    school: "غربال مقرراتی و توکنومیک"
    kind: "youtube"
    handle: "@NoBsCryptoOfficial"
    channel_id: "UCVcMN2cHlHw1Q7wkF2GR8SQ"   # تأییدشده: «No Bs Crypto»
    lang: ["en"]
    scores: false
    enabled: true
    watch: "text"
    notes: >
      ارزش او در رویه است نه نتیجه: جدول غربال با ستون‌های
      واجد شرایط بودن، درآمد، نقدشوندگی، واگذاری ۱۲ ماهه، آزادسازی ۹۰ روزه.
      ستون آزادسازی ۹۰ روزه ≈ شرط سخت ۶ دروازه پذیرش.
      هدف: تبدیل این رویه به ماژول غربال در radar_scan.py.
    conflict: "کانال تبلیغاتی دارد"

  # -------------------------------------------------------------------
  # دفتر ادعاها — سوژه کالیبراسیون
  # -------------------------------------------------------------------

  cryptocity_pro:
    name_fa: "کریپتوسیتی پرو"
    name_en: "Crypto City Pro"
    role: "دفتر ادعاها"
    school: "تکنیکال فارسی"
    kind: "youtube"
    handle: "@CryptoCity_Pro"
    channel_id: "UC2I0e9vRItuSE8-1ub_35AA"   # تأییدشده: «Crypto City Pro»
    collinear_with: "tradecity_pro"
    lang: ["fa"]
    scores: false
    enabled: true
    watch: "full"              # ۱.۷ — نشست ۷ب
    notes: >
      هم‌خطی تأییدشده با تریدسیتی پرو — هر دو از ارشیا عزیزپور.
      شاهد: عنوان ویدئو «تحلیل بیت کوین و آلت کوین ها | از دفتر ارشیا».
      پیامد: توافق این دو کانال یک رأی است، نه دو رأی.
      در گزارش هم‌پوشانی هرگز به‌عنوان تأیید مستقل شمرده نشود.
      انتخاب‌شده نه چون بهترین است، بلکه چون قابل‌سنجش‌ترین است.
      تحلیل‌گری که ورود و استاپ و هدف صریح می‌دهد، ادعایش از قبل ابطال‌پذیر است.
      اولین سوژه آزمون دفتر کالیبراسیون.
    conflict: "کانال تلگرام دارد"

  tekrargar:
    name_fa: "تکرارگر — حمیدرضا برزگر"
    name_en: "Tekrargar"
    role: "دفتر ادعاها"        # ۱.۱ — قبلاً «لایه کشف» بود
    school: "تجمیع و ترجمه"
    kind: "youtube"
    handle: "@tekrargar"
    channel_id: "UCg7VGpxh_RQrYL5nLyF-V0g"   # تأییدشده ۶ اوت
    lang: ["fa"]
    scores: false              # حق رأی از کالیبراسیون می‌آید، نه از حس ما
    enabled: true              # ۱.۱ — روشن شد برای آزمون
    watch: "full"              # ۱.۷ — نشست ۷ب
    notes: >
      تناقض ثبت‌شده و حل‌نشده — همین دلیل روشن‌کردن اوست:
        توضیحات کانال (خوانده‌شده ۶ اوت ۲۰۲۶): معامله‌گر نیست، ترجمه آزاد از
          رسانه‌های انگلیسی، مدل تجربی که خودش از نتیجه‌اش مطمئن نیست.
        مشاهده امیر: جدیداً روی ویدئوها تحلیل و نظر خودش را هم می‌گوید.
      این تناقض با حدس حل نمی‌شود، با شمارش حل می‌شود.
      آزمون تفکیک — نسبت ادعای قوی به کل:
        اگر بیشتر نامزدها ★★ و از جنس «فلانی می‌گوید» بود  ← ترجمه است
        اگر ادعای ★★★★ با «به نظر من» و عدد و تاریخ داشت  ← تحلیل‌گر است
      تا روشن‌شدن نتیجه، جایگاهش موقتی است.
      هشدار پابرجا: نقل از نقل. اگر سالووی را بازگو کرد، سراغ خود سالووی برو.
      حجم بالا (تقریباً روزانه) ← حتماً با --limit اجرا کن.
    conflict: "لینک ثبت‌نام صرافی، پاترون، تریدهاب — انگیزه تجاری مستقیم"

  # -------------------------------------------------------------------
  # چهار لنز قدیمی — روششان از قبل در اسکیل ثبت است
  #
  # اینها تازه نیستند. کارت لنزشان در analyst-lenses.md هست.
  # ولی تا حالا فقط «روش»شان ثبت بود، نه «ادعای امروزشان».
  # بدون رصد زنده، دفتر کالیبراسیون برایشان ساخته نمی‌شود.
  #
  # ۱.۶ — نشست ۴، ۲۹ سپتامبر ۲۰۲۶: سه هندل از چهار هندل پیشین ۴۰۴ می‌داد
  # و منبع بی‌صدا خالی برمی‌گشت. شناسه‌ها با جست‌وجوی یوتیوب پیدا و با صفحه
  # خود کانال و عنوان خوراک رسمی تأیید شدند؛ تأیید کاربر ۲۹ سپتامبر.
  # -------------------------------------------------------------------

  benjamin_cowen:
    name_fa: "بنجامین کوون"
    name_en: "Benjamin Cowen"
    role: "لنز تحلیل‌گر"
    school: "چرخه و نقدینگی"
    kind: "youtube"
    handle: "@benjaminjcowen"               # ۱.۶ — @IntoTheCryptoverse ۴۰۴ می‌داد
    channel_id: "UCRvqjQPSeaWn-uEx-w0XOIg"   # تأییدشده: «Benjamin Cowen»
    lang: ["en"]
    scores: true
    enabled: true
    watch: "full"              # ۱.۷ — نشست ۷ب
    notes: >
      کارت لنز موجود: تسلط بدون استیبل‌کوین، پهنای بازار، بازده کاهشی.
      خطای ثبت‌شده در ممیزی ۲۹ ژوئیه: ترکیب اشتغال، نمونه‌گیری گزینشی فصلی.
      هم‌مکتب با رایول پال ← دو رأی نیستند.
    conflict: "اشتراک پولی Into The Cryptoverse"
    collinear_with: "raoul_pal"

  gareth_soloway:
    name_fa: "گرت سالووی"
    name_en: "Gareth Soloway"
    role: "لنز تحلیل‌گر"
    school: "تکنیکال سطح‌محور"
    kind: "youtube"
    handle: "@GarethSolowayProTrader"       # ۱.۶ — @GarethSoloway ۴۰۴ می‌داد
    channel_id: "UCwTu6kD2igaLMpxswtcdxlg"   # تأییدشده: «Gareth Soloway» — شخصی، نه Verified Investing
    lang: ["en"]
    scores: true
    enabled: true
    # ۱.۷ — نشست ۷ب: دیدن کامل فقط وقتی عنوان کریپتویی است. مرز کلمه اسکی، «s» جمع
    # اختیاری، بی‌حساسیت به بزرگی حرف. دوپهلوها عمداً بیرون: SOL، ADA، LINK، gold.
    watch: "crypto_title"
    watch_keywords: [bitcoin, btc, crypto, cryptocurrency, cryptocurrencies, ethereum, eth,
                     ether, xrp, ripple, solana, altcoin, altseason, blockchain, coinbase,
                     microstrategy, mstr, saylor, stablecoin, dogecoin, doge, cardano,
                     chainlink, binance, halving, ibit, defi]
    notes: >
      کارت لنز موجود: خط روند لگاریتمی چندساله، تأیید شکست با بسته روزانه،
      ورود پله‌ای، تفکیک افق‌ها. قوی‌ترین لنز از نظر انضباط اجرا.
      ادعای ۲۱ ژوئیه ۲۰۲۶ («آلت‌کوین‌ها شکست کردند») هنوز تسویه نشده.
    conflict: "Verified Investing — اشتراک پولی"

  raoul_pal:
    name_fa: "رایول پال"
    name_en: "Raoul Pal"
    role: "لنز تحلیل‌گر"
    school: "چرخه و نقدینگی"
    kind: "youtube"
    handle: "@RaoulPalTJM"                  # ۱.۶ — @RaoulPalTheJourneyMan ۴۰۴ می‌داد
    channel_id: "UCVFSzL3VuZKP3cN9IXdLOtw"   # تأییدشده: «Raoul Pal The Journey Man»
    lang: ["en"]
    scores: true
    enabled: true
    watch: "text"
    notes: >
      کارت لنز موجود: نقدینگی جهانی محرک اصلی. جهت قوی، **لگ ضعیف**.
      نمونه نقض پاییز ۲۰۲۵ ثبت شده. لگ هرگز برای زمان‌بندی استفاده نشود.
      جوزف وانگ همان ادعا را اندازه می‌گیرد ← مقایسه این دو ارزشمند است.
      ۱.۶ — ۲۹ سپتامبر ۲۰۲۶: ۱۱ از ۱۵ آیتم خوراک ویدیوی کوتاه بود.
    conflict: "Real Vision — اشتراک پولی"
    collinear_with: "benjamin_cowen"

  virtualbacon:
    name_fa: "ویرچوال‌بیکن — دنیس لیو"
    name_en: "VirtualBacon"
    role: "دفتر ادعاها"
    school: "روایت و چرخش"
    kind: "youtube"
    handle: "@VirtualBacon"
    channel_id: "UCcrEA_xd9Ldf1C8DIJYdyyA"   # ۱.۶ — تأییدشده: «VirtualBacon»
    lang: ["en"]
    scores: false
    enabled: true
    watch: "text"
    notes: >
      جایگاه پایین‌تر از سه تای بالا — دو خطای ساختاری ثبت‌شده:
      برچسب غلط انبساط کمی، و فرض بی‌پشتوانه چرخش رئیس فدرال‌رزرو.
      قاعده «میانگین ۵۰ هفته = چراغ سبز آلت» با نمونه نقض ۲۰۱۹ ابطال شد.
      نگه‌داشتنش فقط برای کالیبراسیون است، نه برای ورودی.
    conflict: "دوره و اشتراک پولی"

  # -------------------------------------------------------------------
  # پلی‌لیست آموزشی — کتابخانه روش
  #
  # چرا جدا از کانال: خوراک کانال فقط ۱۵ ویدئوی آخر را می‌دهد.
  # دوره بیست‌قسمتی دو سال پیش هرگز در آن ظاهر نمی‌شود.
  # نشانی پلی‌لیست را از یوتیوب کپی کن و اینجا بگذار.
  # -------------------------------------------------------------------

  arshia_course:
    name_fa: "دوره آموزشی ارشیا عزیزپور"
    name_en: "Trade City Pro - Course"
    role: "کتابخانه روش"
    school: "پرایس اکشن و ساختار"
    kind: "playlist"
    playlist_id: "PLRZx7LpGZLGliYfs_ooZEhmcR5ZJ9Oyzc"
    lang: ["fa"]
    scores: false
    enabled: true
    watch: "text"
    notes: >
      ترتیب قسمت‌ها حفظ می‌شود و شماره در عنوان می‌آید — «پارت ۳» بدون
      «پارت ۱» معنا ندارد.
      دروازه ورود هر قاعده به رادار: آزمون خارج از نمونه، پس از کارمزد
      و نرخ تأمین مالی، روی حداقل سه دارایی.
      برای دوره‌های بلند، yt-dlp لازم است تا کل پلی‌لیست شمرده شود.
    conflict: "اپلیکیشن و دوره پولی دارد"
    collinear_with: "tradecity_pro"


# =====================================================================
# جدول مکاتب — محافظ هم‌خطی
#
#  نقدینگی و چرخه ...... کوون ⟷ پال، وانگ (خاموش) ← اشباع، اضافه نکن
#  ریزساختار ........... کایکو (خاموش)         ← عملاً خالی — ۱.۶
#  ماکرو سیستماتیک ..... الیوت، دالیو          ← یک رأی، نه دو
#  تکنیکال سطح‌محور ..... سالووی، عزیزپور       ← جا برای یکی دیگر
#     ⚠ تریدسیتی + کریپتوسیتی = یک نفر (ارشیا) = یک رأی، نه دو
#  روایت و چرخش ........ ویرچوال‌بیکن           ← جا برای یکی دیگر
#  مشتقات و نوسان ...... خالی                  ← بزرگ‌ترین شکاف باقی‌مانده
#  درون‌زنجیره‌ای ........ خالی                  ← شکاف
#  مقررات و کاتالیزور .. خالی                  ← شکاف
#  تجمیع و ترجمه ....... تکرارگر               ← امتیاز نمی‌دهد، مکتب اشغال نمی‌کند
#
# قانون افزودن: منبع تازه فقط وقتی پذیرفته می‌شود که ستون خالی را پر کند.
