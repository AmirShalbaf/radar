name: رادار — نبض چهارساعته

# ─────────────────────────────────────────────────────────────
# مسیر فایل: .github/workflows/radar-pulse.yml
#
# چه می‌کند: حدود هر چهار ساعت
#   ۱) radar_snapshot.py — عکس سبک قیمت، فاندینگ و بهره باز
#   ۲) radar_watch.py --once — سنجش ابطال، پله ورود، هدف و هشدار قیمتی
# و نتیجه را کامیت می‌کند. اگر کلید تلگرام تنظیم باشد، هشدارها
# همان لحظه به تلگرام می‌روند (radar_watch خودش می‌فرستد).
#
# چرا مهم است: قانون تازگی فاز ۱. هر جلسه رادار حداکثر با داده
# چهارساعته شروع می‌شود، بی‌وابستگی به روشن‌بودن کامپیوتر کاربر.
#
# زمان‌بندی — ت۵، متن ۱۸: با «17 */4» گیت‌هاب در ۳۰ روز 108 اجرا از 180 نوبت
# ساخت و بقیه را دیر ساخت یا نساخت؛ هیچ اجرایی شکست نخورد. از بند ۴ متن ۲۰ نوبت هر
# ساعت، و کار due: اگر آخرین نبض موفق کمتر از ۳ ساعت پیش بود و پس از آن بسته روزانه
# تازه‌ای نیامده، بی‌کار تمام می‌شود — از pulse_log.json مخزن، radar_schedule.py. در
# پنجره ۶ ساعت پیش تا ۶ ساعت پس از رویداد با اهمیت بالا و ساعت‌دار events_calendar.json
# فاصله ۵۰ دقیقه. روز عادی همچنان حدود هر ۳ تا ۴ ساعت یک نبض.
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    # دقیقه ۴۱، دور از ازدحام سرِ ساعت و نیم‌ساعت؛ هر ساعت — بند ۴ متن ۲۰
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-pulse
  cancel-in-progress: false

jobs:
  # نگهبان تکرار — ت۵. فقط برداشت مخزن و کتابخانه استاندارد؛ اجرای دستی همیشه کار می‌کند
  due:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - name: برداشت مخزن
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نگهبان تکرار
        id: due
        env:
          PYTHONUTF8: "1"
        run: |
          python radar_schedule.py due pulse --event "${{ github.event_name }}" \
            --github-output "$GITHUB_OUTPUT"

  pulse:
    needs: due
    if: needs.due.outputs.run == 'true'
    # ثابت روی 24.04 — برچسب شناور گیت‌هاب از ۱۹ اکتبر ۲۰۲۶ به 26.04 می‌رود؛ رویداد ۹۰
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: برداشت مخزن
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: نبض بازار
        env:
          PYTHONUTF8: "1"
        run: |
          mkdir -p reports
          # کد خروج برای دفتر نبض — ت۵؛ خطا همچنان سند خطا می‌سازد
          rc=0
          python radar_snapshot.py \
            --out reports/SNAPSHOT.md \
            --json snapshot.json 2> /tmp/snap.log || rc=$?
          echo "$rc" > /tmp/snap_rc
          if [ "$rc" -ne 0 ]; then
            D=$(date -u '+%Y-%m-%d %H:%M UTC')
            {
              echo "# خطای نبض — $D"
              echo
              echo '```'
              tail -c 3000 /tmp/snap.log
              echo '```'
            } > reports/SNAPSHOT.md
          fi

      - name: پایش زنده سطوح
        env:
          PYTHONUTF8: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          D=$(date -u '+%Y-%m-%d %H:%M UTC')
          if [ -f watch.json ]; then
            # خطا بلند است ولی گام را نمی‌اندازد، تا watch_state.json ثبت شود.
            # پیش از نشست ۳ کد خروج اینجا با «یا درست» بلعیده می‌شد و افتادن
            # پایشگر بی‌صدا می‌ماند.
            rc=0
            python radar_watch.py --once > /tmp/watch.log 2>&1 || rc=$?
            echo "$rc" > /tmp/watch_rc
            {
              echo "# پایش زنده — $D"
              echo
              if [ "$rc" -ne 0 ]; then
                echo "⛔ پایشگر با خطا تمام شد — کد $rc"
                echo
              fi
              echo '```'
              tail -c 3000 /tmp/watch.log
              echo '```'
            } > reports/WATCH.md
            if [ "$rc" -ne 0 ]; then
              echo "::error::پایشگر خطا داد — کد $rc، reports/WATCH.md"
            fi
          else
            echo "# پایش زنده — $D" > reports/WATCH.md
            echo >> reports/WATCH.md
            echo "watch.json نیست — پایش رد شد." >> reports/WATCH.md
            echo 0 > /tmp/watch_rc
          fi

      # دفتر نبض — ت۵. نگهبان due و خط سلامت گزارش روزانه از همین می‌خوانند. کد غایب
      # یعنی گام پیش از نوشتن افتاد: 99، پس این نبض موفق شمرده نمی‌شود
      - name: ثبت دفتر نبض
        if: always()
        env:
          PYTHONUTF8: "1"
        run: |
          python radar_schedule.py record \
            --snapshot-rc "$(cat /tmp/snap_rc 2>/dev/null || echo 99)" \
            --watch-rc "$(cat /tmp/watch_rc 2>/dev/null || echo 99)"

      - name: کامیت
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add reports/SNAPSHOT.md reports/WATCH.md snapshot.json watch_state.json pulse_log.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "تغییری نبود."
          else
            git commit -m "نبض — $(date -u +%Y-%m-%d_%H:%M)"
            # push با تلاش دوباره — بند ۵ متن ۲۰: ردشده تا ۳ بار با fetch و merge --no-edit؛
            # force و rebase ممنوع؛ تداخل واقعی کار را با ::error:: روشن می‌اندازد
            python radar_schedule.py push
          fi
