name: رادار — چرخش و کالیبراسیون هفتگی

# ─────────────────────────────────────────────────────────────
# مسیر: .github/workflows/radar-weekly.yml
#
# چه می‌کند:
#   ۱) اسکن چرخش کل بازار با آزمون پامپ کاذب
#   ۲) بازبینی سبد و شمارش ضربه‌ها (قانون سه‌ضربه)
#   ۳) گزارش خودسنجی چارچوب — نرخ اقدام و هزینه فرصت
#
# سطر سوم مهم‌ترین است: تنها مکانیزمی که می‌فهمد رادار
# بیش‌ازحد سخت‌گیر شده یا شل.
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    # یکشنبه ۰۷:۰۰ به وقت هماهنگ جهانی
    - cron: "0 7 * * 0"
  workflow_dispatch:
    inputs:
      regime:
        description: "امتیاز رژیم ماکرو (منفی۲ تا مثبت۲)"
        required: false
        default: "-1.0"
      min_vol:
        description: "حداقل حجم روزانه دلاری"
        required: false
        default: "5000000"

permissions:
  contents: write

concurrency:
  group: radar-weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: برداشت مخزن
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: آماده‌سازی
        run: mkdir -p reports

      - name: اسکن چرخش کل بازار
        env:
          PYTHONUTF8: "1"
        run: |
          python radar_rotate.py \
            --venues okx,gate \
            --min-vol "${{ github.event.inputs.min_vol || '5000000' }}" \
            --top 40 \
            --deep 8 \
            --out "reports/rotate-$(date -u +%Y-%m-%d).md" || true

      - name: بازبینی سبد با نامزدهای چرخش
        env:
          PYTHONUTF8: "1"
        run: |
          if [ -f holdings.json ]; then
            CANDS=$(grep -oE '^\| *[A-Z0-9]{2,10} ' "reports/rotate-$(date -u +%Y-%m-%d).md" 2>/dev/null \
                    | tr -d '| ' | head -5 | paste -sd, -) || CANDS=""
            echo "نامزدها: ${CANDS:-هیچ}"
            python radar_book.py \
              --holdings holdings.json \
              --regime "${{ github.event.inputs.regime || '-1.0' }}" \
              ${CANDS:+--candidates "$CANDS"} \
              --out "reports/book-weekly-$(date -u +%Y-%m-%d).md" || true
          fi

      - name: گزارش کالیبراسیون معاملات
        env:
          PYTHONUTF8: "1"
        run: |
          if [ -f radar_journal.json ]; then
            python radar_journal.py report > "reports/journal-$(date -u +%Y-%m-%d).md" || true
          fi

      - name: گزارش خودسنجی چارچوب
        env:
          PYTHONUTF8: "1"
        run: |
          if [ -f radar_optcost.json ]; then
            python radar_optcost.py followup || true
            python radar_optcost.py report --out "reports/selfcheck-$(date -u +%Y-%m-%d).md" || true
          else
            echo "دفتر هزینه فرصت خالی است."
            echo "بدون آن، نرخ اقدام قابل محاسبه نیست و نمی‌فهمیم"
            echo "چارچوب سخت‌گیر است یا شل. با radar_optcost.py add شروع کن."
          fi

      - name: کامیت
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add reports/ radar_optcost.json book_state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "تغییری نبود."
          else
            git commit -m "گزارش هفتگی رادار — $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: اعلان تلگرام
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              --data-urlencode "text=گزارش هفتگی رادار آماده شد. سه فایل: چرخش، بازبینی سبد، خودسنجی چارچوب." \
              > /dev/null
          fi
