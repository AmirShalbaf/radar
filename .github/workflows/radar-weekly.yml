name: رادار — چرخش و کالیبراسیون هفتگی

# ─────────────────────────────────────────────────────────────
# مسیر: .github/workflows/radar-weekly.yml
#
# چه می‌کند:
#   ۱) اسکن چرخش کل بازار با آزمون پامپ کاذب
#   ۲) بازبینی سبد؛ امتیاز، ضربه و جانشینی فقط اطلاعی، بی‌حکم — ک۸۵
#   ۳) گزارش خودسنجی چارچوب — نرخ اقدام و هزینه فرصت
#
# سطر سوم مهم‌ترین است: تنها مکانیزمی که می‌فهمد رادار
# بیش‌ازحد سخت‌گیر شده یا شل.
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    # یکشنبه، دقیقه ۱۱ دور از ازدحام سرِ ساعت. نوبت دوم دو ساعت بعد — ت۵، متن ۱۸:
    # 4.4 تا 6.6 ساعت دیر ساخته شد. کار due نوبت دوم را بی‌کار می‌کند اگر گزارش خودسنجی
    # یا بازبینی هفتگی سبد از یکشنبه همین هفته هست
    - cron: "11 7 * * 0"
    - cron: "11 9 * * 0"
  workflow_dispatch:
    inputs:
      regime:
        description: "امتیاز رژیم دستی (منفی۲ تا مثبت۲). خالی یعنی خواندن از regime.json"
        required: false
        default: ""
      min_vol:
        description: "حداقل حجم روزانه دلاری"
        required: false
        default: "5000000"

permissions:
  contents: write

concurrency:
  group: radar-weekly
  cancel-in-progress: false

jobs:
  # نگهبان تکرار — ت۵. فقط برداشت مخزن و کتابخانه استاندارد؛ اجرای دستی همیشه کار می‌کند
  due:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - name: برداشت مخزن
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نگهبان تکرار
        id: due
        env:
          PYTHONUTF8: "1"
        run: |
          python radar_schedule.py due weekly --event "${{ github.event_name }}" \
            --github-output "$GITHUB_OUTPUT"

  weekly:
    needs: due
    if: needs.due.outputs.run == 'true'
    # ثابت روی 24.04 — برچسب شناور گیت‌هاب از ۱۹ اکتبر ۲۰۲۶ به 26.04 می‌رود؛ رویداد ۹۰
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: برداشت مخزن
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: آماده‌سازی
        run: mkdir -p reports

      - name: اسکن چرخش کل بازار
        env:
          PYTHONUTF8: "1"
        run: |
          python radar_rotate.py \
            --venues okx,gate \
            --min-vol "${{ github.event.inputs.min_vol || '5000000' }}" \
            --top 40 \
            --deep 8 \
            --out "reports/rotate-$(date -u +%Y-%m-%d).md" || true

      - name: بازبینی سبد با نامزدهای چرخش
        env:
          PYTHONUTF8: "1"
          # ورودی دستی از راه env، نه جاگذاری مستقیم در متن فرمان.
          # خالی یعنی radar_book.py رژیم را از regime.json می‌خواند.
          REGIME_INPUT: ${{ github.event.inputs.regime }}
        run: |
          D=$(date -u +%Y-%m-%d)
          if [ -f holdings.json ]; then
            # سطرهای رتبه‌دار گزارش چرخش — بند ۵ متن ۱۸؛ الگو همان radar_rotate.CANDIDATE_SED
            CANDS=$(sed -nE 's/^\| [0-9]+ \| \*\*([A-Z0-9]{2,10})\*\* .*/\1/p' \
                    "reports/rotate-$D.md" 2>/dev/null | head -5 | paste -sd, -) || CANDS=""
            echo "نامزدها: ${CANDS:-هیچ}"
            if ! python radar_book.py \
                   --holdings holdings.json \
                   ${REGIME_INPUT:+--regime "$REGIME_INPUT"} \
                   ${CANDS:+--candidates "$CANDS"} \
                   --out "reports/book-weekly-$D.md" > /tmp/book.log 2>&1; then
              echo "::error::بازبینی هفتگی سبد خطا داد — reports/book-error-weekly-$D.md"
              {
                echo "# خطای بازبینی هفتگی سبد — $D"
                echo
                echo "بازبینی سبد با خطا افتاد. ته گزارش خطا:"
                echo
                echo '```'
                tail -c 4000 /tmp/book.log
                echo '```'
              } > "reports/book-error-weekly-$D.md"
            fi
          fi

      - name: گزارش کالیبراسیون معاملات
        env:
          PYTHONUTF8: "1"
        run: |
          if [ -f radar_journal.json ]; then
            python radar_journal.py report > "reports/journal-$(date -u +%Y-%m-%d).md" || true
          fi

      - name: گزارش خودسنجی چارچوب
        env:
          PYTHONUTF8: "1"
        run: |
          if [ -f radar_optcost.json ]; then
            python radar_optcost.py followup || true
            python radar_optcost.py report --out "reports/selfcheck-$(date -u +%Y-%m-%d).md" || true
          else
            echo "دفتر هزینه فرصت خالی است."
            echo "بدون آن، نرخ اقدام قابل محاسبه نیست و نمی‌فهمیم"
            echo "چارچوب سخت‌گیر است یا شل. با radar_optcost.py add شروع کن."
          fi

      - name: کامیت
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add reports/ radar_optcost.json book_state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "تغییری نبود."
          else
            git commit -m "گزارش هفتگی رادار — $(date -u +%Y-%m-%d)"
            git push
          fi

      # ارسال فقط از radar_telegram.py، با رسید — بازبینی ۲۳ اکتبر، یافته م۴
      - name: اعلان تلگرام
        if: always()
        env:
          PYTHONUTF8: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if ! python radar_telegram.py --text "گزارش هفتگی رادار آماده شد. سه فایل: چرخش، بازبینی سبد، خودسنجی چارچوب."; then
            echo "::error::پیام تلگرام هفتگی نرسید — رسید بالا"
          fi
