name: رادار — اسکن روزانه

# ─────────────────────────────────────────────────────────────
# این فایل باید در مسیر .github/workflows/radar-daily.yml قرار بگیرد.
#
# چه می‌کند: هر روز اسکن واچ‌لیست را اجرا می‌کند، خروجی را در
# reports/ می‌نویسد و به مخزن کامیت می‌کند. بعد در گفتگو فقط
# می‌گویی «گزارش امروز را بخوان» و کلاود از گیت‌هاب می‌خواندش.
#
# چرا مهم است: روتین روزانه دیگر به روشن‌بودن کامپیوتر وابسته نیست.
# سنجه «نرخ اقدام» فقط وقتی معنا دارد که جلسات منظم باشند.
#
# هشدار جغرافیایی: رانرهای گیت‌هاب در آمریکا هستند. بایننس ۴۵۱ و
# بای‌بیت ۴۰۳ برمی‌گردانند. فقط okx,gate کار می‌کنند — همان محدودیت کولب.
#
# تغییر فاز ۱ رادار ۷ (۲۹ اوت ۲۰۲۶): گام اسکن بازنویسی شد.
# پیش از این «|| true» هر خطایی را می‌بلعید و --out پوشه می‌ساخت؛
# نتیجه: اسکن بی‌صدا خراب بود و هیچ scan-*.md در مخزن نمی‌نشست.
# حالا خطا در reports/scan-error-*.md ثبت و دیده می‌شود.
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    # ۰۶:۳۰ به وقت هماهنگ جهانی — پس از بسته‌شدن کندل روزانه
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      preset:
        description: "پریست واچ‌لیست"
        required: false
        default: "watch"
        type: choice
        options: [main, watch, all]

permissions:
  contents: write

concurrency:
  group: radar-daily
  cancel-in-progress: false

jobs:
  scan:
    # ثابت روی 24.04 — برچسب شناور گیت‌هاب از ۱۹ اکتبر ۲۰۲۶ به 26.04 می‌رود؛ رویداد ۹۰
    runs-on: ubuntu-24.04
    # از ۲۵ به ۴۰ با اسکنر پامپ — نشست ۹؛ گام اسکنر خودش سقف ۱۲ دقیقه دارد
    timeout-minutes: 40

    steps:
      - name: برداشت مخزن
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ساخت پوشه گزارش
        run: mkdir -p reports

      - name: اسکن واچ‌لیست
        env:
          PYTHONUTF8: "1"
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
        run: |
          D=$(date -u +%Y-%m-%d)
          PRESET="${{ github.event.inputs.preset || 'watch' }}"
          if python radar_scan.py \
               --preset "$PRESET" \
               --venues okx,gate \
               --top 5 \
               --stdout > /tmp/scan.md 2> /tmp/scan.log; then
            mv /tmp/scan.md "reports/scan-$D.md"
            echo "اسکن موفق: reports/scan-$D.md"
          else
            {
              echo "# خطای اسکن — $D"
              echo
              echo "اسکن با خطا افتاد. ته گزارش خطا:"
              echo
              echo '```'
              tail -c 4000 /tmp/scan.log
              echo '```'
            } > "reports/scan-error-$D.md"
            echo "اسکن خطا داد — reports/scan-error-$D.md نوشته شد."
          fi

      # رژیم پیش از سبد ساخته می‌شود تا سبد رژیم امروز را بخواند.
      # خطای ساخت رژیم معتبر قبلی را بازنویسی نمی‌کند — فقط last_build_error؛
      # سند خطا فقط وقتی فایل معتبری نبود (کار خود radar_regime.py). خطا
      # بی‌صدا نیست، ولی گام‌های بعد هم متوقف نمی‌شوند: سبد خودش «رژیم کهنه»
      # یا هشدار خطای ساخت را کنار رژیم می‌گوید.
      - name: ساخت رژیم
        env:
          PYTHONUTF8: "1"
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          D=$(date -u +%Y-%m-%d)
          if python radar_regime.py \
               --venues okx,gate \
               --report "reports/regime-$D.md" > /tmp/regime.log 2>&1; then
            tail -n 1 /tmp/regime.log
          else
            echo "::error::ساخت رژیم خطا داد — reports/regime-error-$D.md"
            {
              echo "# خطای ساخت رژیم — $D"
              echo
              echo "ساخت رژیم با خطا افتاد. regime.json معتبر قبلی بازنویسی نشد و فقط"
              echo "last_build_error گرفت؛ اگر فایل معتبری نبود، سند خطا نوشته شد."
              echo "ته گزارش خطا:"
              echo
              echo '```'
              tail -c 4000 /tmp/regime.log
              echo '```'
            } > "reports/regime-error-$D.md"
          fi

      - name: بازبینی سبد و موتور خروج
        env:
          PYTHONUTF8: "1"
        # رژیم از regime.json می‌آید. پیش از این `-1.0` ثابت تزریق می‌شد.
        # نبود یا کهنگی فایل در خود گزارش «رژیم کهنه» اعلام می‌شود.
        # خطا بی‌صدا نیست، ولی گام‌های بعد را هم متوقف نمی‌کند.
        run: |
          D=$(date -u +%Y-%m-%d)
          if [ -f holdings.json ]; then
            if ! python radar_book.py \
                   --holdings holdings.json \
                   --out "reports/book-$D.md" > /tmp/book.log 2>&1; then
              echo "::error::بازبینی سبد خطا داد — reports/book-error-$D.md"
              {
                echo "# خطای بازبینی سبد — $D"
                echo
                echo "بازبینی سبد با خطا افتاد. ته گزارش خطا:"
                echo
                echo '```'
                tail -c 4000 /tmp/book.log
                echo '```'
              } > "reports/book-error-$D.md"
            fi
          else
            echo "holdings.json نیست — بازبینی سبد رد شد."
            echo "برای ساختش: python radar_book.py --init"
          fi

      # سطوح ساختاری پوزیشن‌های باز — فهرست نمادها از holdings.json، نه از
      # این متن. خطا بی‌صدا نیست، ولی گام‌های بعد را هم متوقف نمی‌کند.
      # کندل روزانه وقت جهانی، 1Dutc، با نگهبان لنگر radar_anchor — نشست ۳ب.
      - name: سطوح ساختاری سبد
        env:
          PYTHONUTF8: "1"
        run: |
          D=$(date -u +%Y-%m-%d)
          if [ -f holdings.json ]; then
            if ! SYMS=$(python radar_positions.py --holdings holdings.json symbols 2> /tmp/levels.log); then
              echo "::error::فهرست نمادهای سبد خطا داد — reports/levels-error-$D.md"
              { echo "# خطای سطوح ساختاری — $D"; echo; echo '```'
                tail -c 4000 /tmp/levels.log; echo '```'; } > "reports/levels-error-$D.md"
            elif ! python radar_levels.py --watchlist "$SYMS" \
                   --out "reports/levels-$D.md" > /tmp/levels.log 2>&1; then
              echo "::error::سطوح ساختاری خطا داد — reports/levels-error-$D.md"
              { echo "# خطای سطوح ساختاری — $D"; echo; echo '```'
                tail -c 4000 /tmp/levels.log; echo '```'; } > "reports/levels-error-$D.md"
            fi
          else
            echo "holdings.json نیست — سطوح ساختاری سبد رد شد."
          fi

      # اسکنر پامپ — نشست ۹. پیش از گام رویداد، تا radar_events نامزد تازه را از
      # pump.json بخواند. شکست نرم مثل گام رویداد: فایل خطای صریح و یک خط هشدار، و بقیه
      # گام‌ها ادامه می‌دهند. timeout درون پوسته تا در سررسید هم فایل خطا نوشته شود.
      - name: اسکنر پامپ
        timeout-minutes: 12
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
        run: |
          D=$(date -u +%Y-%m-%d)
          if ! timeout 11m python radar_pump.py --out reports/PUMP.md --json pump.json \
                 --ledger pump_ledger.json --line /tmp/pump_line.txt > /tmp/pump.log 2>&1; then
            echo "::error::اسکنر پامپ خطا داد — reports/pump-error-$D.md"
            { echo "# خطای اسکنر پامپ — $D"; echo
              echo "اسکنر پامپ کامل اجرا نشد. ته گزارش خطا:"; echo; echo '```'
              tail -c 4000 /tmp/pump.log; echo '```'; } > "reports/pump-error-$D.md"
            echo "⚠️ اسکنر پامپ خطا داد — reports/pump-error-$D.md" > /tmp/pump_line.txt
          fi

      # تقویم کلان، وتوی آزادسازی و دفتر رویداد — نشست ۱۰. کد ۲ یعنی منبعی نیامد
      # ولی گزارش نوشته شد؛ هر کد جز صفر خطای صریح است، نه بلعیده. خط تلگرام و بخش
      # خلاصه از /tmp به گام بعد می‌روند.
      - name: تقویم رویداد و آزادسازی
        env:
          PYTHONUTF8: "1"
        run: |
          D=$(date -u +%Y-%m-%d)
          if ! python radar_events.py --holdings holdings.json \
                 --out "reports/events-$D.md" --section /tmp/events_section.md \
                 --line /tmp/events_line.txt > /tmp/events.log 2>&1; then
            echo "::error::تقویم رویداد خطا داد — reports/events-error-$D.md"
            { echo "# خطای تقویم رویداد — $D"; echo
              echo "تقویم رویداد کامل ساخته نشد. ته گزارش خطا:"; echo; echo '```'
              tail -c 4000 /tmp/events.log; echo '```'; } > "reports/events-error-$D.md"
            echo "⚠️ تقویم رویداد خطا داد — reports/events-error-$D.md" > /tmp/events_line.txt
          fi

      - name: به‌روزرسانی پیگیری دفتر هزینه فرصت
        env:
          PYTHONUTF8: "1"
        run: |
          if [ -f radar_optcost.json ]; then
            python radar_optcost.py followup || true
            python radar_optcost.py report --out reports/optcost.md || true
          fi

      # قاعده این گام: هیچ متنی اینجا دوباره نوشته نمی‌شود.
      # برچسب نسخه و قانون تازگی هر دو از اسکریپت پایتون می‌آیند، چون
      # متنی که در دو جا نوشته شود دیر یا زود از هم جدا می‌افتد — یک بار
      # افتاد و گردش‌کار ماه‌ها «رادار ۶.۰» می‌فرستاد.
      - name: ساخت خلاصه امروز
        env:
          PYTHONUTF8: "1"
        run: |
          D=$(date -u +%Y-%m-%d)
          # تازگی داده‌های دستی — بالای خلاصه تا در پیام تلگرام هم بیاید.
          # بیرون از گروه زیر: پوسته با bash -e اجرا می‌شود و شکست داخل گروه
          # کل گام را می‌انداخت. خطا بی‌صدا نیست.
          if ! python radar_watch.py --staleness --holdings holdings.json \
                 --watch watch.json > /tmp/staleness.md 2> /tmp/staleness.err; then
            echo "::error::سنجش تازگی داده‌های دستی خطا داد"
            { echo "## تازگی داده‌های دستی"; echo; echo "⚠️ سنجش تازگی خطا داد:"; echo
              echo '```'; tail -c 1500 /tmp/staleness.err; echo '```'; } > /tmp/staleness.md
          fi
          {
            echo "# گزارش رادار — $D"
            echo
            echo "تولیدشده خودکار توسط گردش‌کار گیت‌هاب."
            echo
            # یک خط ساده رویداد — نشست ۱۰. همین خط به پیام تلگرام می‌رود؛ بازطراحی
            # پیام مال نشست ۱۱ است.
            if [ -s /tmp/events_line.txt ]; then
              cat /tmp/events_line.txt
            else
              echo "⚠️ تقویم رویداد: خط ساخته نشد"
            fi
            echo
            # یک خط اسکنر پامپ — نشست ۹: تعداد کارت و نامشان، و تعداد هر بخش
            if [ -s /tmp/pump_line.txt ]; then
              cat /tmp/pump_line.txt
            else
              echo "⚠️ اسکنر پامپ: خط ساخته نشد"
            fi
            echo
            cat /tmp/staleness.md
            echo
            # بخش کامل رویداد میان دو نشانه — گام تلگرام آن را برمی‌دارد
            echo "<!-- رویداد-آغاز -->"
            if [ -s /tmp/events_section.md ]; then
              cat /tmp/events_section.md
            else
              echo "## رویدادهای ۱۴ روز آینده"; echo
              echo "⚠️ ساخته نشد — فایل events-error امروز را ببین."
            fi
            echo "<!-- رویداد-پایان -->"
            echo
            echo "## فایل‌های امروز"
            echo
            for f in reports/*-$D.md; do
              [ -e "$f" ] && echo "- \`$f\`"
            done
            echo
            echo "## تازگی نبض"
            echo
            if [ -f reports/SNAPSHOT.md ]; then
              python radar_snapshot.py --freshness
            else
              echo "هنوز نبض چهارساعته اجرا نشده."
            fi
            echo
            python radar_state.py --opening
          } > reports/LATEST.md

      - name: کامیت گزارش‌ها
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add reports/ radar_optcost.json book_state.json 2>/dev/null || true
          # رژیم و تاریخچه‌اش — خط git add جدا، بدون || true. فایل غایب
          # اعلام می‌شود، نه بلعیده؛ تاریخچه تا نخستین ساخت موفق نیست.
          for f in regime.json regime_history.json events_ledger.json \
                   pump.json pump_ledger.json reports/PUMP.md; do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "::warning::$f نیست — کامیت نشد"
            fi
          done
          if git diff --staged --quiet; then
            echo "تغییری نبود."
          else
            git pull --rebase --autostash || true
            git commit -m "گزارش خودکار رادار — $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: اعلان تلگرام
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            # بخش رویداد در پیام نمی‌آید، فقط خط ساده بالای خلاصه — نشست ۱۰
            MSG=$(sed '/<!-- رویداد-آغاز -->/,/<!-- رویداد-پایان -->/d' reports/LATEST.md | head -c 3500)
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              -d parse_mode="Markdown" \
              --data-urlencode "text=${MSG}" > /dev/null
            echo "اعلان تلگرام ارسال شد."
          else
            echo "کلید تلگرام تنظیم نشده — رد شد."
            echo "برای فعال‌سازی: Settings > Secrets > TELEGRAM_BOT_TOKEN و TELEGRAM_CHAT_ID"
          fi
