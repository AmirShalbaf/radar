name: رادار — سنجش دسترسی منابع

# ─────────────────────────────────────────────────────────────
# مسیر: .github/workflows/radar-probe.yml
#
# چه می‌کند:
#   هر منبع تقویم کلان، آزادسازی توکن و سه منبع تکرارگر را یک بار از
#   همین اجراکننده گیت‌هاب می‌خواند و کد پاسخ، اندازه و نشانه محتوا را
#   در reports/probe-sources-<تاریخ>.md می‌نویسد — نشست ۱۰، ایستگاه ۱.
#
# فقط دستی، بی‌زمان‌بندی. هیچ داده‌ای ذخیره نمی‌شود؛ فقط همین گزارش
# کامیت می‌شود. منبع بسته داده سنجش است، نه خطا؛ گام فقط با خرابی خود
# اسکریپت می‌افتد.
# ─────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: برداشت مخزن
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: سنجش منابع
        env:
          PYTHONUTF8: "1"
        run: |
          D=$(date -u +%Y-%m-%d)
          python radar_probe.py --out "reports/probe-sources-$D.md"

      - name: کامیت گزارش
        run: |
          D=$(date -u +%Y-%m-%d)
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add "reports/probe-sources-$D.md"
          if git diff --staged --quiet; then
            echo "تغییری نبود."
          else
            git pull --rebase --autostash
            git commit -m "سنجش دسترسی منابع — $D"
            git push
          fi
