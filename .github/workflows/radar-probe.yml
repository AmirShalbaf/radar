name: رادار — سنجش دسترسی منابع

# ─────────────────────────────────────────────────────────────
# مسیر: .github/workflows/radar-probe.yml
#
# چه می‌کند:
#   هر منبع تقویم کلان، آزادسازی توکن، سه منبع تکرارگر و اسکنر پامپ را یک بار از
#   همین اجراکننده گیت‌هاب می‌خواند و کد پاسخ، اندازه و نشانه محتوا را
#   در reports/probe-sources-<تاریخ>.md می‌نویسد — نشست ۱۰، ایستگاه ۱.
#
# فقط دستی، بی‌زمان‌بندی. هیچ داده‌ای ذخیره نمی‌شود؛ فقط همین گزارش
# کامیت می‌شود. منبع بسته داده سنجش است، نه خطا؛ گام فقط با خرابی خود
# اسکریپت می‌افتد.
#
# سنجش CoinGlass — متن ۲۲: یازده نقطه پایانی v4 و سرور MCP رسمی با کلید
# COINGLASS_API_KEY، در reports/probe-coinglass-<تاریخ>.md. کلید فقط در env همان
# گام است، نه سطح کار و نه سطح گردش‌کار؛ radar_probe.py آن را فقط با سرآیند
# CG-API-KEY و فقط به میزبان CoinGlass می‌فرستد و هرگز چاپ نمی‌کند. مخزن عمومی است.
# ─────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      # آزمایش اجراکننده تازه پیش از جابه‌جایی — رویداد ۹۰. گردش‌کارهای زمان‌بندی‌شده
      # روی 24.04 ثابت‌اند؛ 26.04 فقط با اجرای دستی همین‌جا سنجیده می‌شود.
      runner:
        description: "اجراکننده"
        required: false
        default: "ubuntu-24.04"
        type: choice
        options: [ubuntu-24.04, ubuntu-26.04]
      # «فقط CoinGlass» گام سنجش منابع را رد می‌کند — متن ۲۲
      scope:
        description: "دامنه سنجش"
        required: false
        default: "همه"
        type: choice
        options: [همه, فقط CoinGlass]

permissions:
  contents: write

concurrency:
  group: radar-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 20

    steps:
      - name: برداشت مخزن
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: سنجش منابع
        if: ${{ (inputs.scope || 'همه') == 'همه' }}
        env:
          PYTHONUTF8: "1"
        run: |
          D=$(date -u +%Y-%m-%d)
          python radar_probe.py --out "reports/probe-sources-$D.md"

      # کلید فقط همین‌جا — متن ۲۲. کلید غایب یعنی گزارش «کلید تنظیم نشده»، نه شکست
      - name: سنجش CoinGlass
        env:
          PYTHONUTF8: "1"
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
        run: |
          D=$(date -u +%Y-%m-%d)
          python radar_probe.py --coinglass --out "reports/probe-coinglass-$D.md" > /dev/null
          echo "گزارش: reports/probe-coinglass-$D.md"

      - name: کامیت گزارش
        run: |
          D=$(date -u +%Y-%m-%d)
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          [ -f "reports/probe-sources-$D.md" ] && git add "reports/probe-sources-$D.md"
          [ -f "reports/probe-coinglass-$D.md" ] && git add "reports/probe-coinglass-$D.md"
          if git diff --staged --quiet; then
            echo "تغییری نبود."
          else
            git commit -m "سنجش دسترسی منابع — $D"
            # push با تلاش دوباره — متن ۲۲، همان راه متن ۲۰: ردشده تا ۳ بار با fetch و
            # merge --no-edit؛ بی بازنویسی تاریخچه؛ تداخل واقعی با ::error:: روشن می‌افتد
            python radar_schedule.py push
          fi

      # پس از کامیت، تا گزارش سنجش در هر حال بماند. شکست آزمون گام را می‌اندازد —
      # همان نشانه‌ای که پیش از جابه‌جایی به 26.04 لازم است.
      - name: آزمون مخزن روی همین اجراکننده
        env:
          PYTHONUTF8: "1"
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q tests
